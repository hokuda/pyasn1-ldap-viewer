<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LDAP Hex Dump Decoder</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main>
  <h1>LDAP Hex Dump Decoder</h1>
  <p class="lead">
    Paste the hex dump section from the output of Java's
    <code>-Djavax.net.debug=ssl,record,plaintext</code>, and it decodes it
    as an LDAP message using
    <a href="https://github.com/hokuda/pyasn1_ldap" target="_blank" rel="noopener">pyasn1_ldap</a>,
    displaying it in a human-readable format.
  </p>

  <textarea id="input" rows="14" spellcheck="false"
    placeholder="0000: 30 81 84 02 01 03 60 81   7B 02 01 03 04 00 80 00  0.....`.{.......&#10;0010: 00 04 00                                            ..."></textarea>

  <div class="controls">
    <button id="decodeBtn" disabled>Decode</button>
    <button id="clearBtn">Clear</button>
    <span id="status">Loading Python runtime&hellip;</span>
  </div>

  <div id="error" class="error" hidden></div>
  <div id="output"></div>
</main>

<script src="https://cdn.jsdelivr.net/pyodide/v314.0.6/full/pyodide.js"></script>
<script src="./app.js"></script>
</body>
</html>
